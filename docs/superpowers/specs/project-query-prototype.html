const head = (title, desc, action='') => `<div class="section-head row between wrap"><div><h3>${title}</h3>${desc ? `<p class="muted">${desc}</p>` : ''}</div>${action}</div>`;

function table(headCells, rows, empty='暂无记录', numCols=new Set(), wrapClass='table-wrap') {
  return `<div class="${wrapClass}" tabindex="0" role="region" aria-label="${esc(headCells[0])}数据表"><table><thead><tr>${headCells.map((h,i)=>`<th scope="col"${numCols.has(i)?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(row=>`<tr>${row.map((cell,i)=>`<td${numCols.has(i)?' class="num"':''}>${cell}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headCells.length}" class="empty">${esc(empty)}</td></tr>`}</tbody></table></div>`;
}

let toastTimer;
function toast(message) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  toastTimer = setTimeout(() => $('toast').textContent = '', 3800);
}

/** trim + 大写；空串表示不走自动匹配。 */
function normalizeShort(value) {
  return String(value ?? '').trim().toUpperCase();
}

function autoRangeKeys(shortName) {
  const needle = normalizeShort(shortName);
  if (!needle) return [];
  return Object.keys(jiraCatalog).filter(key => key.toUpperCase().includes(needle));
}

function catalogMeta(key) {
  return jiraCatalog[key] || {name: '待验证项目（原型可移除）', status: 'pending'};
}

function rangeEntries(project) {
  const auto = new Set(autoRangeKeys(project.shortName));
  const manual = new Set(project.manualRanges.map(normalizeShort));
  return [...new Set([...auto, ...manual])].sort().map(key => {
    const meta = catalogMeta(key);
    const sources = [];
    if (auto.has(key)) sources.push('auto');
    if (manual.has(key)) sources.push('manual');
    return {key, name: meta.name, status: meta.status, sources};
  });
}

function effectiveRangeKeys(project) {
  return rangeEntries(project).map(entry => entry.key);
}

function crmIssueMap() {
  return Object.fromEntries(crmIssues.map(row => [row[0], row]));
}

function projectTaskKeys(project) {
  return [...new Set([...crmIssues.map(row => row[0]), ...project.issues])];
}

function projectTaskCount(project) {
  return projectTaskKeys(project).length;
}

function sourcePills(sources, status) {
  const marks = sources.map(src => src === 'auto'
    ? pill('自动匹配', 'blue')
    : pill('手动补充', 'live'));
  if (status === 'example') marks.push(pill('规则示例 · 待验证', 'warn'));
  else if (status === 'pending') marks.push(pill('待验证', 'warn'));
  return marks.join(' ');
}

const collapsedCustomerGroups = new Set();

function renderProjects() {
  const list = $('projects');
  if (list.dataset.searching === 'false') {
    for (const group of list.querySelectorAll('.customer-group')) {
      if (group.open) collapsedCustomerGroups.delete(group.dataset.customerId);
      else collapsedCustomerGroups.add(group.dataset.customerId);
    }
  }

  const query = $('project-query').value.trim();
  const results = projects.filter(project =>
    [project.id, project.crmId, project.title, project.shortName, ...Object.values(project.fact), ...Object.values(project.local)]
      .some(value => match(value, query) || match(clients[value], query))
  );
  $('project-count').textContent = `${results.length} 个`;
  list.dataset.searching = String(Boolean(query));

  const groups = new Map();
  for (const project of results) {
    const customerId = project.fact.contract || '';
    if (!groups.has(customerId)) groups.set(customerId, []);
    groups.get(customerId).push(project);
  }

  list.innerHTML = [...groups].map(([customerId, members]) => {
    const customerName = clients[customerId] || customerId || '未填写签约客户';
    const open = query || !collapsedCustomerGroups.has(customerId);
    const cards = members.map(project =>
      `<button class="project" type="button" data-action="project" data-value="${esc(project.id)}" aria-pressed="${project === state.project}">
        <span class="row between"><small class="mono">${esc(project.id)}</small>${pill(project.stage, 'live')}</span>
        <strong>${esc(project.title)}</strong>
        <small>项目经理 · ${esc(project.owner)}</small>
      </button>`
    ).join('');
    return `<details class="customer-group" data-customer-id="${esc(customerId)}"${open ? ' open' : ''}>
      <summary><span class="customer-group-name">${esc(customerName)}</span>${pill(`${members.length} 个`)}</summary>
      <div class="customer-group-projects">${cards}</div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的项目</div>';
}

function costCompareRows() {
  const budgetMap = Object.fromEntries(budgetItems.map(([k, v, src]) => [k, {v, src}]));
  const costMap = Object.fromEntries(costItems.map(([k, v, src]) => [k, {v, src}]));
  /** 预算侧「研发」对照成本侧「开发」；其余按同名对齐。 */
  const pairs = [
    ['实施', '实施'],
    ['研发', '开发'],
    ['差旅', '差旅'],
    ['管理', '管理'],
    ['外采', '硬件外采'],
    ['税费', '税费']
  ];
  return pairs.map(([bKey, cKey]) => {
    const b = budgetMap[bKey];
    const c = costMap[cKey];
    const delta = (b?.v != null && c?.v != null) ? b.v - c.v : null;
    const deltaCell = delta === null
      ? '<span class="muted">—</span>'
      : `<span class="${delta >= 0 ? 'delta-pos' : 'delta-neg'}">${delta >= 0 ? '+' : ''}${money(delta)}</span>`;
    return [
      `${esc(bKey)} → ${esc(cKey)}`,
      b?.v === null ? '—' : money(b?.v),
      money(c?.v),
      deltaCell,
      `<small>${esc(b?.src || '')}</small><small>${esc(c?.src || '')}</small>`
    ];
  });
}

/** 范围变化时丢弃已失效的项目筛选；再按仍可用状态收紧状态筛选。 */
function sanitizeTaskFilters(project) {
  const ranges = new Set(effectiveRangeKeys(project));
  const nextProjects = state.projectTaskJiraKeys.filter(key => ranges.has(key));
  if (nextProjects.length !== state.projectTaskJiraKeys.length) {
    state.projectTaskJiraKeys = nextProjects;
  }
  const available = new Set(availableStatuses(project, state.projectTaskJiraKeys));
  const nextStatuses = state.projectTaskStatuses.filter(status => available.has(status));
  if (nextStatuses.length !== state.projectTaskStatuses.length) {
    state.projectTaskStatuses = nextStatuses;
  }
}

/** 当前项目筛选下可用的状态：预设 ∪ 命中任务上的状态。 */
function availableStatuses(project, selectedProjects = state.projectTaskJiraKeys) {
  const map = crmIssueMap();
  const projectFilter = new Set(selectedProjects);
  const fromTasks = projectTaskKeys(project)
    .filter(key => !projectFilter.size || projectFilter.has(jiraKey(key)))
    .map(key => map[key]?.[2])
    .filter(Boolean);
  return [...new Set([...jiraStatusDefaults, ...fromTasks])];
}

function msSummary(selected, allLabel, formatOne) {
  if (!selected.length) return allLabel;
  if (selected.length === 1) return formatOne(selected[0]);
  if (selected.length <= 2) return selected.map(formatOne).join('、');
  return `已选 ${selected.length} 项`;
}

function msMarkup({id, label, allLabel, options, selected, formatOne}) {
  const open = state.openMs === id;
  const summary = msSummary(selected, allLabel, formatOne);
  const selectedSet = new Set(selected);
  const optionHtml = options.length
    ? options.map(opt => {
      const checked = selectedSet.has(opt.value) ? ' checked' : '';
      return `<label class="ms-option"><input type="checkbox" value="${esc(opt.value)}"${checked}><span>${opt.html}</span></label>`;
    }).join('')
    : '<div class="ms-empty">暂无可选项</div>';
  return `<div class="ms" data-ms="${esc(id)}" data-ms-label="${esc(label)}">
    <button type="button" class="ms-trigger" id="${esc(id)}-trigger" aria-haspopup="listbox" aria-expanded="${open}" aria-controls="${esc(id)}-menu" aria-label="${esc(label)}">
      <span class="ms-label">${esc(summary)}</span><span class="ms-caret" aria-hidden="true">▾</span>
    </button>
    <button type="button" class="ms-clear" data-ms-clear="${esc(id)}" aria-label="清空${esc(label)}"${selected.length ? '' : ' hidden'}>×</button>
    <div class="ms-menu" id="${esc(id)}-menu" role="listbox" aria-multiselectable="true" aria-label="${esc(label)}"${open ? '' : ' hidden'}>${optionHtml}</div>
  </div>`;
}

function syncMsChrome(id, selected, allLabel, formatOne) {
  const root = document.querySelector(`[data-ms="${id}"]`);
  if (!root) return;
  const label = root.querySelector('.ms-label');
  const clear = root.querySelector('.ms-clear');
  const trigger = root.querySelector('.ms-trigger');
  if (label) label.textContent = msSummary(selected, allLabel, formatOne);
  if (clear) clear.hidden = !selected.length;
  if (trigger) trigger.setAttribute('aria-expanded', String(state.openMs === id));
  const menu = root.querySelector('.ms-menu');
  if (menu) menu.hidden = state.openMs !== id;
}

function closeMs() {
  if (!state.openMs) return;
  const prev = state.openMs;
  state.openMs = null;
  const root = document.querySelector(`[data-ms="${prev}"]`);
  if (!root) return;
  root.querySelector('.ms-trigger')?.setAttribute('aria-expanded', 'false');
  const menu = root.querySelector('.ms-menu');
  if (menu) menu.hidden = true;
}

function openMs(id) {
  if (state.openMs && state.openMs !== id) closeMs();
  state.openMs = id;
  const root = document.querySelector(`[data-ms="${id}"]`);
  if (!root) return;
  root.querySelector('.ms-trigger')?.setAttribute('aria-expanded', 'true');
  const menu = root.querySelector('.ms-menu');
  if (menu) {
    menu.hidden = false;
    const focusable = menu.querySelector('input[type=checkbox]');
    focusable?.focus();
  }
}

function rebuildStatusMs(project) {
  const root = document.querySelector('[data-ms="project-task-status"]');
  if (!root) return;
  const menu = root.querySelector('.ms-menu');
  if (!menu) return;
  const statuses = availableStatuses(project, state.projectTaskJiraKeys);
  const selected = new Set(state.projectTaskStatuses);
  menu.innerHTML = statuses.length
    ? statuses.map(status => `<label class="ms-option"><input type="checkbox" value="${esc(status)}"${selected.has(status) ? ' checked' : ''}><span>${esc(status)}</span></label>`).join('')
    : '<div class="ms-empty">暂无可选项</div>';
  syncMsChrome('project-task-status', state.projectTaskStatuses, '全部状态', value => value);
}

/** 项目任务默认 = ERP ∪ 本地补充；范围内候选需显式切换，不自动并入项目任务。 */
function projectTaskRows(project) {
  sanitizeTaskFilters(project);
  const map = crmIssueMap();
  const selectedProjects = new Set(state.projectTaskJiraKeys);
  const selectedStatuses = new Set(state.projectTaskStatuses);
  let keys = projectTaskKeys(project);
  if (selectedProjects.size) keys = keys.filter(key => selectedProjects.has(jiraKey(key)));
  keys = keys.filter(key => {
    const row = map[key];
    const title = row ? row[1] : '本地补充（无快照正文）';
    const status = row ? row[2] : '';
    return (!selectedStatuses.size || selectedStatuses.has(status))
      && [key, title].some(v => match(v, state.projectTaskQuery));
  });
  const rows = keys.map(key => {
    const crm = map[key];
    const title = crm ? crm[1] : '本地补充任务（原型无正文快照）';
    const fields = jiraIssueFields[key] || {};
    const status = crm ? crm[2] : '待验证';
    return [
      `${link('issue', key, key, 'mono')}<small>${esc(title)}</small>`,
      esc(jiraKey(key)),
      pill(status, crm ? 'live' : 'warn'),
      esc(fields.priority ?? '—'),
      esc(fields.batch ?? '—'),
      esc(fields.dueDate ?? '—'),
      esc(fields.assignee ?? '—')
    ];
  });
  return {keys, rows};
}

      ${sourcePills(entry.sources, entry.status)}
      ${note}
      ${canRemoveManual ? link('unbound-range', entry.key, '移除手动', 'remove') : ''}
    </span>`;
  }).join('');

  const shortNorm = normalizeShort(project.shortName);
  return `
    <section class="task-block">
      ${head('范围配置', '有效范围 = 简称自动匹配 ∪ 手动补充；空简称只走手动。范围只影响「范围内候选」筛选，不改写项目任务。')}
      <div class="short-box">
        <label>项目简称
          <input class="search" id="short-name" type="text" spellcheck="false" value="${esc(project.shortName)}" placeholder="例如 XKRL；留空=仅手动" aria-label="项目简称">
        </label>
        ${button('apply-short', '', '应用简称', 'primary')}
        <small class="muted">匹配规则：trim 后转大写，对 Jira 项目 key 做 substring 包含。当前规范化：<span class="mono">${esc(shortNorm || '（空）')}</span></small>
      </div>
      <div class="range-list" style="margin-top:12px">${rangeChips || '<span class="muted">当前无有效范围。可填写简称自动匹配，或手动添加项目。</span>'}</div>
      <div class="actions" style="margin-top:12px">
        ${button('choose-range', '', '添加手动范围')}
        <small class="muted">已核实有任务：XKRL、XKRLWXM。XKRLWXV 为规则示例/待验证，无任务。正式版须解析到已授权项目 ID。移除范围不会增删 ERP 关联或本地补充。</small>
      </div>
    </section>
    <p class="footnote">搜索、状态筛选、范围内候选与「按 key 精确补充」已统一到「项目任务」子页，避免两处重复列出同一任务。</p>`;
}

function tasks(project) {
  const nav = Object.entries(jiraViews).map(([key, label]) =>
    `<button type="button" data-action="jira-view" data-value="${key}" aria-pressed="${key === state.jiraView}">${label}${key === 'project' ? ` · ${projectTaskCount(project)}` : ''}</button>`
  ).join('');
  const body = state.jiraView === 'scope' ? scopeConfigView(project) : projectTasksView(project);
  return `<div class="jira-shell"><nav class="jira-nav" aria-label="Jira 子视图">${nav}</nav><div class="jira-pane">${body}</div></div>`;
}

function renderDetail() {
  const project = state.project;
  const tabs = Object.keys(labels).map(tab =>
    `<button type="button" data-action="tab" data-value="${tab}" aria-pressed="${tab === state.tab}">${labels[tab]}${tab === 'tasks' ? ` · ${projectTaskCount(project)}` : ''}</button>`
  ).join('');
  $('detail').innerHTML = `
    <div class="card identity">
      <div class="row between wrap">
        <div class="row"><span class="mono muted">${project.id}</span>${pill(project.stage, 'live')}${pill(project.crmId, 'ghost')}</div>
        ${pill('真实快照 · 2026-11-18', 'blue')}
      </div>
      <h2>${esc(project.title)}</h2>
      <div class="meta">
        <div><small>签约客户</small><strong>${esc(clients[project.fact.contract])}</strong></div>
        <div><small>实际使用方</small><strong>${esc(clients[project.fact.user])}</strong></div>
        <div><small>计划交付</small><strong>${esc(project.planDelivery)}</strong></div>
      </div>
    </div>
    <div class="card panel">${costCards()}</div>
    <div class="card">
      <nav class="navigation" aria-label="项目详情视图">${tabs}</nav>
      <div class="panel">${({overview, cost: costs, people, tasks})[state.tab](project)}</div>
    </div>`;

}

const modal = $('dialog');
let dialogSubmit;
let dialogTrigger;

function showDialog(title, body, {confirm='', danger=false, submit} = {}) {
  $('dialog-title').textContent = title;
  $('dialog-body').innerHTML = body;
  $('dialog-actions').innerHTML = `<button class="btn" type="button" data-close autofocus>${confirm ? '取消' : '关闭'}</button>${confirm ? `<button class="btn ${danger ? 'danger' : 'primary'}" type="submit">${esc(confirm)}</button>` : ''}`;
  dialogSubmit = submit;
  dialogTrigger = document.activeElement;
  modal.showModal();
}

function facts(entries) {
  return `<dl class="facts">${entries.map(([key, value]) => `<dt>${esc(key)}</dt><dd>${esc(value)}</dd>`).join('')}</dl>`;
}

function refresh(message, focusAction) {
  renderProjects();
  renderDetail();
  if (focusAction) {
    const [action, value] = focusAction;
    const buttons = [...document.querySelectorAll('[data-action]')];
    const next = buttons.find(b => b.dataset.action === action && b.dataset.value === value);
    const activeTab = document.querySelector('.navigation [aria-pressed=true]');
    (next || activeTab)?.focus();
  }
  if (message) toast(message);
}

function chooseCustomer(project, role) {
  const remote = project.fact[role];
  const local = project.local[role];
  const options = Object.entries(clients).map(([id, name]) =>
    `<option value="${id}"${local === id ? ' selected' : ''}>${name} · ${id}</option>`
  ).join('');
  showDialog(
    `${local ? '修改' : '绑定'}${roles[role]}`,
    `${facts([
      ['当前项目', project.title],
      ['ERP 事实', remote ? `${clients[remote]} · ${remote}` : 'ERP 未提供'],
      ['说明', '仅可从本项目已查到的两客户中选择；保存只更新本地模拟关联']
    ])}<label class="field">本地关联客户<select name="client" class="search" required><option value="">请选择</option>${options}</select></label><small>ERP 列保持只读事实；本地列与 ERP 已关联事实相互独立。</small>`,
    {confirm: '保存绑定', submit(form) {
      project.local[role] = form.get('client');
      return [`已保存${roles[role]}本地绑定（模拟）`, ['customer', role]];
    }}
  );
}

function confirmRemoval(title, entries, description, submit) {
  showDialog(title, `${facts(entries)}<p class="muted">${esc(description)}</p>`, {confirm: '确认移除', danger: true, submit});
}

function bindIssue(project, key) {
  if (crmIssueMap()[key]) {
    return [`${key} 已由 ERP 关联，无需重复绑定`, ['issue', key]];
  }
  if (project.issues.includes(key)) return [`${key} 已在本地补充中`, ['unbound-issue', key]];
  project.issues.push(key);
  return [`已本地补充 ${key}（模拟）`, ['unbound-issue', key]];
}

function issueDetail(project, key) {
  const row = crmIssueMap()[key];
  const linked = project.issues.includes(key);
  const inRange = effectiveRangeKeys(project).includes(jiraKey(key));
  const taskMeta = devTasks.find(t => t.key === key);
  if (!row) {
    showDialog(
      `${key} · 本地补充`,
      facts([
        ['数据来源', '本地补充 · 原型无正文快照'],
        ['范围内', inRange ? '是' : '否'],
        ['本地补充', linked ? '是' : '否']
      ]),
      linked ? {confirm: '移除本地补充', danger: true, submit: () => {
        project.issues = project.issues.filter(item => item !== key);
        return [`已移除 ${key} 的本地补充`, ['jira-view', 'project']];
      }} : {}
    );
    return;
  }
  const [, title, status, , date, hours, amount] = row;
  showDialog(
    `${key} · ${title}`,
    facts([
      ['数据来源', `ERP 既有关联 · ${catalogMeta(jiraKey(key)).name}`],
      ['状态', status],
      ['工时', `${hours} h`],
      ['金额（ERP）', money(amount)],
      ['归类', taskMeta?.kind || '—'],
      ['范围内', inRange ? '是' : '否'],
      ['ERP 关联', '已关联 · 不重复绑定'],
      ['本地补充', linked ? '是（与 ERP 并存去重）' : '否'],
      ['快照日期', date]
    ])
  );
}

function applyShortName(project) {
  const input = $('short-name');
  const next = input ? input.value : project.shortName;
  const normalized = normalizeShort(next);
  project.shortName = next.trim();
  sanitizeTaskFilters(project);
  const auto = autoRangeKeys(project.shortName);
  const msg = normalized
    ? `已应用简称 ${normalized} · 自动命中 ${auto.join('、') || '无'}`
    : '简称已清空 · 仅保留手动范围';
  return [msg, ['apply-short', '']];
}

function exactIssue(project) {
  showDialog(
    '按 Issue key 精确补充',
    `${facts([
      ['说明', '用于 ERP 未挂但属于本项目的任务。已在 ERP 关联中的 key 不会重复绑定。'],
      ['正式版', '必须解析到当前授权来源的稳定 issue ID']
    ])}
    <label class="field">Issue key
      <input class="search" name="issue" type="text" required spellcheck="false" placeholder="例如 XKRL-999" aria-label="Issue key">
    </label>
    <small>原型不编造任务正文；补充后仅在项目任务列表显示 key，并可移除。</small>`,
    {confirm: '补充到项目', submit(form) {
      const key = String(form.get('issue') || '').trim().toUpperCase();
      if (!key) return ['请输入 Issue key', ['exact-issue', '']];
      if (crmIssueMap()[key]) {
        return [`${key} 已由 ERP 关联，无需重复绑定`, ['jira-view', 'project']];
      }
      if (project.issues.includes(key)) {
        return [`${key} 已在本地补充中（幂等）`, ['unbound-issue', key]];
      }
      project.issues.push(key);
      state.jiraView = 'project';
      return [`已本地补充 ${key}（模拟 · 无正文快照）`, ['jira-view', 'project']];
    }}
  );
}

function chooseRange(project) {
  const auto = new Set(autoRangeKeys(project.shortName));
  const manual = new Set(project.manualRanges.map(normalizeShort));
  const catalogOptions = Object.entries(jiraCatalog).map(([key, meta]) => {
    const tags = [];
    if (auto.has(key)) tags.push('已自动命中');
    if (manual.has(key)) tags.push('已手动');
    if (meta.status === 'example') tags.push('规则示例');
    return `<option value="${key}">${key} · ${meta.name}${tags.length ? `（${tags.join(' · ')}）` : ''}</option>`;
  }).join('');
  showDialog(
    '添加手动 Jira 范围',
    `${facts([
      ['当前简称', normalizeShort(project.shortName) || '（空 · 仅手动）'],
      ['说明', '与自动命中重合时幂等；来源可同时标自动+手动。正式版须解析到已授权项目 ID。']
    ])}
    <label class="field">从目录选择
      <select name="range" class="search">
        <option value="">请选择（可改用手输）</option>
        ${catalogOptions}
      </select>
    </label>
    <label class="field">或手输项目 key（原型记为待验证，可移除）
      <input class="search" name="custom" type="text" spellcheck="false" placeholder="例如 DEMO" aria-label="手输 Jira 项目 key">
    </label>
    <small>XKRLWXV 无本样本任务，仅演示匹配规则。手输未知 key 不会编造任务。</small>`,
    {confirm: '添加手动范围', submit(form) {
      const custom = normalizeShort(form.get('custom'));
      const selected = normalizeShort(form.get('range'));
      const key = custom || selected;
      if (!key) return ['请选择或输入 Jira 项目 key', ['choose-range', '']];
      const alreadyManual = project.manualRanges.map(normalizeShort).includes(key);
      const alreadyAuto = autoRangeKeys(project.shortName).includes(key);
      if (alreadyManual) {
        return [`${key} 已在手动范围中（幂等）` + (alreadyAuto ? '；同时由简称自动命中，故仍在范围内' : ''), ['choose-range', '']];
      }
      project.manualRanges.push(key);
      sanitizeTaskFilters(project);
      if (alreadyAuto) {
        return [`已记录 ${key} 为手动补充；该项目同时由简称自动命中，仍在范围内（未重复建项）`, ['choose-range', '']];
      }
      const meta = catalogMeta(key);
      const suffix = meta.status === 'pending' ? ' · 待验证（原型可移除）' : meta.status === 'example' ? ' · 规则示例，无任务' : '';
      return [`已添加手动范围 ${key}${suffix}`, ['choose-range', '']];
    }}
  );
}

const actions = {
  project(project, id) {
    if (project.id === id) return;
    Object.assign(state, {
      project: projects.find(item => item.id === id),
      tab: 'cost',
      costView: 'budget',
      jiraView: 'project',
      projectTaskQuery: '',
      projectTaskStatuses: [],
      projectTaskJiraKeys: [],
      openMs: null
    });
    refresh('', ['project', id]);
  },
  tab(project, tab) {
    state.tab = tab;
    state.openMs = null;
    if (tab === 'cost' && !costViews[state.costView]) state.costView = 'budget';
    if (tab === 'tasks' && !jiraViews[state.jiraView]) state.jiraView = 'project';
    refresh('', ['tab', tab]);
  },
  'cost-view'(project, view) {
    state.tab = 'cost';
    state.costView = costViews[view] ? view : 'budget';
    refresh('', ['cost-view', state.costView]);
  },
  'jira-view'(project, view) {
    state.tab = 'tasks';
    state.openMs = null;
    state.jiraView = jiraViews[view] ? view : 'project';
    refresh('', ['jira-view', state.jiraView]);
  },
  'apply-short'(project) {
    refresh(...applyShortName(project));
  },
  customer: chooseCustomer,
  'unbound-client'(project, role) {
    confirmRemoval(
      `取消${roles[role]}本地绑定`,
      [['当前项目', project.title], ['本地关联客户', clients[project.local[role]]]],
      '仅清除该角色的本地模拟关联。ERP 事实与另一角色绑定均保留。',
      () => { project.local[role] = null; return [`已取消${roles[role]}本地绑定`, ['customer', role]]; }
    );
  },
  person(project, index) {
    const [name, role, source, hours, status, start] = project.staff[Number(index)];
    showDialog(`人员来源 · ${name}`, facts([
      ['项目角色', role],
      ['来源', source],
      ['成员工时', `${hours} h`],
      ['参与状态', status],
      ['起始', start],
      ['数据性质', 'ERP Members 真实快照']
    ]));
  },
  'choose-range': chooseRange,
  'exact-issue': exactIssue,
  'unbound-range'(project, key) {
    const norm = normalizeShort(key);
    const stillAuto = autoRangeKeys(project.shortName).includes(norm);
    confirmRemoval(
      '移除手动 Jira 范围',
      [
        ['当前项目', project.title],
        ['手动范围', `${norm} · ${catalogMeta(norm).name}`],
        ['简称是否仍命中', stillAuto ? `是（${normalizeShort(project.shortName)}）` : '否']
      ],
      stillAuto
        ? '将移除手动标记；因简称仍命中，该项目会留在自动范围。本地补充任务不受影响。'
        : '移除后该项目退出有效范围。已有本地补充仍可在项目任务中查看。',
      () => {
        project.manualRanges = project.manualRanges.filter(item => normalizeShort(item) !== norm);
        sanitizeTaskFilters(project);
        const msg = stillAuto
          ? `已移除 ${norm} 的手动标记；因简称仍命中，保留在自动范围`
          : `已移除手动范围 ${norm}`;
        return [msg, ['choose-range', '']];
      }
    );
  },
  issue: issueDetail,
  'bind-issue'(project, key) { refresh(...bindIssue(project, key)); },
  'unbound-issue'(project, key) {
    if (crmIssueMap()[key] && !project.issues.includes(key)) {
      toast(`${key} 为 ERP 既有关联，不能通过本地解绑移除`);
      return;
    }
    confirmRemoval(
      '移除本地补充',
      [['当前项目', project.title], ['Jira Issue', key]],
      '只移除本地补充关系。ERP 既有关联与远端记录不受影响。',
      () => {
        project.issues = project.issues.filter(item => item !== key);
        return [`已移除 ${key} 的本地补充`, ['jira-view', 'project']];
      }
    );
  }
};

function readMsSelection(menu) {
  return [...menu.querySelectorAll('input[type=checkbox]:checked')].map(input => input.value);
}

function onProjectMsChange(project) {
  const prevStatuses = [...state.projectTaskStatuses];
  state.projectTaskJiraKeys = readMsSelection(document.querySelector('#project-task-jira-menu'));
  const available = new Set(availableStatuses(project, state.projectTaskJiraKeys));
  state.projectTaskStatuses = prevStatuses.filter(status => available.has(status));
  rebuildStatusMs(project);
  renderProjectTasks();
}

function onStatusMsChange() {
  state.projectTaskStatuses = readMsSelection(document.querySelector('#project-task-status-menu'));
  renderProjectTasks();
}

function clearMs(id) {
  if (id === 'project-task-jira') {
    state.projectTaskJiraKeys = [];
    const available = new Set(availableStatuses(state.project, []));
    state.projectTaskStatuses = state.projectTaskStatuses.filter(status => available.has(status));
    const menu = document.querySelector('#project-task-jira-menu');
    if (menu) menu.querySelectorAll('input[type=checkbox]').forEach(input => { input.checked = false; });
    rebuildStatusMs(state.project);
  } else if (id === 'project-task-status') {
    state.projectTaskStatuses = [];
    const menu = document.querySelector('#project-task-status-menu');
    if (menu) menu.querySelectorAll('input[type=checkbox]').forEach(input => { input.checked = false; });
  }
  renderProjectTasks();
}

document.addEventListener('click', event => {
  if (event.target.closest('[data-close]')) { modal.close(); return; }
  const clear = event.target.closest('[data-ms-clear]');
  if (clear) {
    event.preventDefault();
    clearMs(clear.dataset.msClear);
    return;
  }
  const trigger = event.target.closest('.ms-trigger');
  if (trigger) {
    const root = trigger.closest('[data-ms]');
    const id = root?.dataset.ms;
    if (!id) return;
    if (state.openMs === id) closeMs();
    else openMs(id);
    return;
  }
  if (!event.target.closest('.ms')) closeMs();
  const control = event.target.closest('button[data-action]');
  if (control) actions[control.dataset.action](state.project, control.dataset.value);
});
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !state.openMs || modal.open) return;
  const openRoot = document.querySelector(`[data-ms="${state.openMs}"]`);
  event.preventDefault();
  closeMs();
  openRoot?.querySelector('.ms-trigger')?.focus();
});
$('dialog-form').addEventListener('submit', event => {
  event.preventDefault();
  if (!dialogSubmit) return;
  const result = dialogSubmit(new FormData(event.currentTarget));
  modal.close();
  if (result) refresh(...result);
});
modal.addEventListener('close', () => { if (dialogTrigger?.isConnected) dialogTrigger.focus(); });
$('project-query').addEventListener('input', renderProjects);
$('detail').addEventListener('input', event => {
  if (event.target.id === 'project-task-query') { state.projectTaskQuery = event.target.value; renderProjectTasks(); }
});
$('detail').addEventListener('change', event => {
  const option = event.target.closest('.ms-option input[type=checkbox]');
  if (!option) return;
  const root = option.closest('[data-ms]');
  const id = root?.dataset.ms;
  if (id === 'project-task-jira') onProjectMsChange(state.project);
  else if (id === 'project-task-status') onStatusMsChange();
});
$('detail').addEventListener('keydown', event => {
  if (event.target.id === 'short-name' && event.key === 'Enter') {
    event.preventDefault();
    refresh(...applyShortName(state.project));
    return;
  }
  if (event.key === 'Escape' && state.openMs) {
    const openRoot = document.querySelector(`[data-ms="${state.openMs}"]`);
    event.preventDefault();
    closeMs();
    openRoot?.querySelector('.ms-trigger')?.focus();
    return;
  }
  const msRoot = event.target.closest('[data-ms]');
  if (!msRoot) return;
  const id = msRoot.dataset.ms;
  const menu = msRoot.querySelector('.ms-menu');
  const boxes = menu ? [...menu.querySelectorAll('input[type=checkbox]')] : [];
  if (event.target.classList.contains('ms-trigger') || event.target.closest('.ms-trigger')) {
    if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openMs(id);
    }
    return;
  }
  if (!boxes.length || menu?.hidden) return;
  const index = boxes.indexOf(document.activeElement) >= 0
    ? boxes.indexOf(document.activeElement)
    : boxes.indexOf(event.target);
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    boxes[(index + 1 + boxes.length) % boxes.length]?.focus();
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    boxes[(index - 1 + boxes.length) % boxes.length]?.focus();
  } else if (event.key === 'Home') {
    event.preventDefault();
    boxes[0]?.focus();
  } else if (event.key === 'End') {
    event.preventDefault();
    boxes[boxes.length - 1]?.focus();
  }
});

refresh();
</script>
