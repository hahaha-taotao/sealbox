name: Release

on:
  push:
    tags:
      # 一个 tag 就是一次完整发布：桌面版和 Android 都从同一个 commit 出包。
      - "v*"
      - "mobile-v*"

permissions:
  contents: write

# 同一个 ref 被重复触发时只留一套构建，避免两套并行抢同一个 Release 资产。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build desktop installer and publish the release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check release version
        shell: pwsh
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Run extension tests
        run: node --test extension/fill-logic.test.js

      - name: Resolve release name
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("mobile-v")) {
            $name = "Sealbox mobile " + $tag.Substring(8)
          } else {
            $name = "Sealbox " + $tag
          }
          "release_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: 桌面安装包与 Android APK 由同一次构建产出（${{ github.sha }}），两端都不单独发布。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Verify the updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -qx 'latest.json'

      # Desktop in-app updates read releases/latest/download/latest.json, so a
      # mobile release must never take the "latest" slot away from a desktop one.
      - name: Keep the desktop release as latest
        if: startsWith(github.ref_name, 'mobile-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest=false

  android:
    name: Build and upload Android arm64 APK
    needs: release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri-mobile
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13846066
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        working-directory: .
        run: npm ci

      - name: Install Android SDK packages
        working-directory: .
        run: |
          SDK="${ANDROID_SDK_ROOT}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
          test -d "$NDK_HOME"

      - name: Generate the Android project
        working-directory: .
        env:
          CI: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          ls -ld "$ANDROID_HOME" "$NDK_HOME"
          rm -rf src-tauri-mobile/gen/android
          cd src-tauri-mobile
          npx tauri android init --ci --skip-targets-install -v
          test -d gen/android/app/src/main/java/com/sealbox/mobile
          cd ..
          node scripts/patch-mobile-android.mjs

      - name: Configure Android signing
        working-directory: .
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/sealbox-release.jks"
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE"
            ALIAS="$ANDROID_KEY_ALIAS"
            PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::ANDROID_KEY_BASE64 is not set; signing with a throwaway key."
            ALIAS="sealbox"
            PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Sealbox, O=Sealbox, C=CN"
          fi
          printf 'password=%s\nkeyAlias=%s\nstoreFile=%s\n' "$PASSWORD" "$ALIAS" "$KEYSTORE" \
            > src-tauri-mobile/gen/android/keystore.properties
          keytool -list -v -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias "$ALIAS" \
            | grep -E "SHA256:" | head -n 1

      - name: Build release APK
        working-directory: src-tauri-mobile
        env:
          CI: true
          TAURI_APP_PATH: ${{ github.workspace }}/src-tauri-mobile
        run: |
          set +e
          npx tauri android build --ci --apk --target aarch64 > ../dist-build.log 2>&1
          status=$?
          set -e
          mkdir -p ../dist
          cp ../dist-build.log ../dist/android-build.log
          tail -n 160 ../dist/android-build.log
          exit "$status"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: dist/android-build.log
          if-no-files-found: ignore

      - name: Collect the APK
        working-directory: .
        run: |
          VERSION="$(node -p "require('./src-tauri-mobile/tauri.conf.json').version")"
          APK="$(find src-tauri-mobile/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/Sealbox-mobile-${VERSION}-arm64.apk"
          echo "APK_PATH=dist/Sealbox-mobile-${VERSION}-arm64.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealbox-mobile-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
