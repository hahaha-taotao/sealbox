name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish Android arm64 APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri-mobile
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13846066
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        working-directory: .
        run: npm ci

      - name: Install Android SDK packages
        working-directory: .
        run: |
          SDK="${ANDROID_SDK_ROOT}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
          test -d "$NDK_HOME"

      - name: Generate the Android project
        working-directory: .
        env:
          CI: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          ls -ld "$ANDROID_HOME" "$NDK_HOME"
          rm -rf src-tauri-mobile/gen/android
          cd src-tauri-mobile
          npx tauri android init --ci --skip-targets-install -v
          test -d gen/android/app/src/main/java/com/sealbox/mobile
          cd ..
          node scripts/patch-mobile-android.mjs

      - name: Build release APK
        working-directory: src-tauri-mobile
        env:
          CI: true
          # npm resets the script cwd to the repo root, where the CLI would pick
          # up src-tauri/tauri.conf.json instead of the mobile configuration.
          TAURI_APP_PATH: ${{ github.workspace }}/src-tauri-mobile
        run: |
          set +e
          npx tauri android build --ci --apk --target aarch64 > ../dist-build.log 2>&1
          status=$?
          set -e
          mkdir -p ../dist
          cp ../dist-build.log ../dist/android-build.log
          tail -n 160 ../dist/android-build.log
          if [ "$status" -ne 0 ]; then
            cd ..
            git config user.email "435915720@qq.com"
            git config user.name "张文宇"
            git checkout -B ci/android-build-log
            git add -f dist/android-build.log
            git commit -m "chore: capture Android build log"
            git push --force origin ci/android-build-log
          fi
          exit "$status"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: dist/android-build.log
          if-no-files-found: ignore

      - name: Collect the APK
        working-directory: .
        run: |
          VERSION="$(node -p "require('./src-tauri-mobile/tauri.conf.json').version")"
          APK="$(find src-tauri-mobile/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/Sealbox-mobile-${VERSION}-arm64.apk"
          echo "APK_PATH=dist/Sealbox-mobile-${VERSION}-arm64.apk" >> "$GITHUB_ENV"
          echo "MOBILE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealbox-mobile-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish the mobile release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sealbox mobile ${{ env.MOBILE_VERSION }}
          body: |
            Android arm64 release APK for Sealbox mobile ${{ env.MOBILE_VERSION }}.
            Install `Sealbox-mobile-${{ env.MOBILE_VERSION }}-arm64.apk` on the phone.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
