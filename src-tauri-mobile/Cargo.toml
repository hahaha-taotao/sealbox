[package]
name = "sealbox-mobile"
version = "0.1.0"
description = "Sealbox Android vault"
edition = "2021"

[lib]
name = "sealbox_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sealbox-core = { path = "../crates/sealbox-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
ndk-context = "0.1"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
